<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JobConnect - Messages</title>

{% if user_type == "employer" %}

<link rel="stylesheet" href="/css/employerHeader.css">

{% else %}

<link rel="stylesheet" href="/css/base.css">

<link rel="stylesheet" href="/static/style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
{% endif %}

<link rel="stylesheet" href="/css/chat.css?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

{% if user_type == "employer" %}

{% include "employerHeader.html" %}

{% else %}

{% include "components/header.html" %}

{% endif %}

<div class="container chat-page {% if user_type == 'employer' %} employer-chat {% else %} user-chat {% endif %}">
<main>

<section class="chat-card">

<!-- Header -->

<div class="chat-header">

    <div class="header-title">

        <h2>
            <i class="fa-solid fa-comments"></i>
            Messages
        </h2>

        <p>View and continue your conversations</p>

    </div>

    <!-- Conversation Search -->

    <div class="conversation-search">

        <i class="fa-solid fa-magnifying-glass"></i>

        <input
            type="search"
            id="conversationSearch"
            placeholder="Search conversations..."
            aria-label="Search conversations"
            autocomplete="off"
        >

        <button
            type="button"
            id="clearConversationSearch"
            aria-label="Clear search"
            hidden
        >
            <i class="fa-solid fa-xmark"></i>
        </button>

    </div>

</div>

<!-- Conversation List -->

<div
class="conversation-body"
id="conversationList">

</div>

</section>

</main>

</div>

<script>

// ==========================================
// Current User
// ==========================================

const currentUserId = "{{ userId }}";
const currentUserType = "{{ userType }}";

const conversationList =
    document.getElementById("conversationList");

const searchInput =
    document.getElementById("conversationSearch");

const clearSearchButton =
    document.getElementById("clearConversationSearch");

let allConversations = [];


// ==========================================
// Load Conversations
// ==========================================

async function loadConversations() {

    try {

        const response = await fetch(
            `/api/conversations?userId=${encodeURIComponent(currentUserId)}` +
            `&userType=${encodeURIComponent(currentUserType)}`
        );

        if (!response.ok) {
            throw new Error("Failed to load conversations.");
        }

        const data = await response.json();

        allConversations = Array.isArray(data) ? data : [];

        renderConversations(allConversations);

    } catch (error) {

        console.error(error);

        conversationList.innerHTML = `
            <div class="empty-message">

                <i class="fa-solid fa-circle-exclamation"></i>

                <h3>Unable to load conversations</h3>

                <p>Please refresh the page and try again.</p>

            </div>
        `;

    }

}


// ==========================================
// Render Conversations
// ==========================================

function renderConversations(conversations, isSearching = false) {

    conversationList.innerHTML = "";

    if (conversations.length === 0) {

        if (isSearching) {

            conversationList.innerHTML = `
                <div class="empty-message">

                    <i class="fa-solid fa-magnifying-glass"></i>

                    <h3>No conversations found</h3>

                    <p>Try searching for another name or message.</p>

                </div>
            `;

        } else {

            conversationList.innerHTML = `
                <div class="empty-message">

                    <i class="fa-solid fa-comment-slash"></i>

                    <h3>No conversations yet</h3>

                    <p>Your conversations will appear here.</p>

                </div>
            `;

        }

        return;

    }

    conversations.forEach(chat => {

        const div = document.createElement("div");
        div.className = "conversation-item";

        const chatName = chat.name || "Unknown User";
        const lastMessage =
            chat.lastMessage || "No messages yet";

        div.innerHTML = `
            <div class="conversation-avatar">
                ${escapeHtml(chatName.charAt(0).toUpperCase())}
            </div>

            <div class="conversation-content">

                <div class="conversation-top">

                    <h3>${escapeHtml(chatName)}</h3>

                    <span class="conversation-time">
                        ${formatTime(chat.time)}
                    </span>

                </div>

                <div class="conversation-bottom">

                    <p>${escapeHtml(lastMessage)}</p>

                    <i class="fa-solid fa-chevron-right"></i>

                </div>

            </div>
        `;

        div.addEventListener("click", () => {

            const parameters = new URLSearchParams({
                employerId: chat.employerId || "",
                jobSeekerId: chat.jobSeekerId || "",
                senderId: chat.senderId || "",
                senderType: chat.senderType || ""
            });

            window.location.href =
                `/chat?${parameters.toString()}`;

        });

        conversationList.appendChild(div);

    });

}


// ==========================================
// Search Conversations
// ==========================================

function searchConversations() {

    const searchText =
        searchInput.value.trim().toLowerCase();

    clearSearchButton.hidden = searchText === "";

    if (searchText === "") {

        renderConversations(allConversations);
        return;

    }

    const filteredConversations =
        allConversations.filter(chat => {

            const name =
                String(chat.name || "").toLowerCase();

            const message =
                String(chat.lastMessage || "").toLowerCase();

            return (
                name.includes(searchText) ||
                message.includes(searchText)
            );

        });

    renderConversations(filteredConversations, true);

}


// Search while typing

searchInput.addEventListener(
    "input",
    searchConversations
);


// ==========================================
// Clear Search
// ==========================================

clearSearchButton.addEventListener("click", () => {

    searchInput.value = "";
    clearSearchButton.hidden = true;

    renderConversations(allConversations);

    searchInput.focus();

});


// ==========================================
// Format Time
// ==========================================

function formatTime(time) {

    if (!time) {
        return "";
    }

    const date = new Date(time);

    if (Number.isNaN(date.getTime())) {
        return "";
    }

    return date.toLocaleTimeString([], {
        hour: "2-digit",
        minute: "2-digit"
    });

}


// ==========================================
// Prevent HTML Injection
// ==========================================

function escapeHtml(value) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


// ==========================================
// Start
// ==========================================

loadConversations();

</script>

</body>

</html>
